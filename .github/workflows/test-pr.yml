# https://micro-os-plus.github.io/micro-os-plus-iii/
# https://github.com/micro-os-plus/micro-os-plus-iii/actions/workflows/test-ci.yml

# Workflow for running some tests on each Push.
name: Test on Pull Request

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on pull requests, if all conditions are met:
  pull_request:
    # ... on the active branches ...
    branches:
      - 'xpack-development'
      - 'xpack'
    # ... skip tags only ...
    tags-ignore:
      - '**'
    # ... include everything except ...
    paths-ignore:
      - '.claude/**'
      - '.github/skills'
      - '.github/skills/**'
      - '.github/workflows/publish-github-pages.yml'
      - '.github/workflows/test-all.yml'
      - '.github/copilot-instructions.md'
      - '.github/FUNDING.yml'
      - '.settings/**'
      - '.vscode/**'
      - 'maintenance/**'
      - 'doxygen/**'
      - 'tests/scripts/**'
      - 'website/**'
      - 'docs/**'
      - 'LICENSE*'
      - '**.md'
      - '.gitignore'
      - '.npmignore'
      - '**/README**'

# Allow one concurrent run per push; new pushes cancel older runs.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: 'tests-pr-${{ github.event.pull_request.number }}'
  # A new pull request to the same branch cancels the older run.
  cancel-in-progress: true

jobs:
  ci-test:
    name: 'µOS++ IIIe PR tests'

    runs-on: ${{ matrix.os }}

    strategy:
      # Run all platforms to completion, even if one fails.
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images
        os:
          [
            'ubuntu-26.04',
            'ubuntu-26.04-arm',
            'macos-26-intel',
            'macos-26',
            'windows-2025'
          ]
        # https://nodejs.org/en - use LTS
        node-version: ['24']
        # https://www.npmjs.com/package/xpm
        xpm-version: ['0.23.2']

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 3

      - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install xpm@${{ matrix.xpm-version }} on ${{ matrix.os }}
        run: npm install -g xpm@${{ matrix.xpm-version }}

      - name: Show environment
        run: |
          id
          uname -a
          node --version
          npm --version
          xpm --version
          env | sort

      - name: Clean xPack cache Linux
        if: runner.os == 'Linux'
        run: |
          rm -rf "${HOME}/.cache/xPacks"

      - name: Clean xPack cache macOS
        if: runner.os == 'macOS'
        run: |
          rm -rf "${HOME}/Library/Caches/xPacks"

      - name: Clean xPack cache Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cachePath = "$env:LOCALAPPDATA\Caches\xPacks"
          if (Test-Path -LiteralPath $cachePath) {
            Remove-Item -LiteralPath $cachePath -Force -Recurse -ErrorAction SilentlyContinue
          }

      - name: Satisfy project dependencies on ${{ matrix.os }}
        run: |
          npm ci
          npm --prefix tests ci
          xpm install -C tests

      - name: Satisfy platforms dependencies on ${{ matrix.os }}
        run: |
          xpm run install-all -C tests

      - name: Run platforms tests on ${{ matrix.os }}
        run: xpm run test-all -C tests
        env:
          CI: true

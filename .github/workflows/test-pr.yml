# https://help.github.com/en/actions
# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
# https://github.com/actions

# https://github.com/micro-os-plus/micro-os-plus-iii/actions/workflows/test-pr.yml

# Workflow for running some tests on each Pull Request.
name: Test on Pull Request

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on pull requests, if all conditions are met:
  pull_request:
    paths-ignore:
      - '.claude/**'
      - '.github/skills/**'
      - '.github/copilot-instructions.md'
      - '.github/FUNDING.yml'
      - '.settings/**'
      - '.vscode/**'
      - 'config/**'
      - 'docs/**'
      - 'doxygen/**'
      - 'inspiration/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/scripts/**'
      - 'LICENSE*'
      - '**.md'
      - '.gitignore'
      - '.npmignore'
      - '**/README**'


# Allow one concurrent run per pull request; new pushes cancel older runs.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: "tests-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

# Pull requests from forks must not get write access.
permissions:
  contents: read

jobs:
  ci-test:
    name: 'µOS++ IIIe PR tests'

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
        # macos-13 is x64, macos-15 is arm64.
        os: [ 'ubuntu-24.04', 'ubuntu-24.04-arm', 'macos-15-intel', 'macos-15', 'windows-2025' ]

    steps:
    - name: Checkout
      # https://github.com/actions/checkout/
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 3

    - name: Setup Node.js on ${{ matrix.os }}
      # https://github.com/actions/setup-node/
      uses: actions/setup-node@v7.0.0
      with:
        # https://nodejs.org/en - use LTS
        node-version: 22

    - name: Install xpm on ${{ matrix.os }}
      run: |
        # https://www.npmjs.com/package/xpm
        npm install -g xpm@0.20.8

    - name: Show environment
      run: |
        id
        uname -a
        node --version
        npm --version
        xpm --version
        env | sort

    - name: Satisfy project dependencies on ${{ matrix.os }}
      run: |
        npm --prefix tests ci
        xpm run install-ci -C tests

    - name: Run tests on ${{ matrix.os }}
      run: xpm run test-ci -C tests
      env:
        CI: true
